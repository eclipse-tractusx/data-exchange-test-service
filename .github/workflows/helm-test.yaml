name: Lint and Test Chart

on:
  push:
    paths:
      - 'charts/**'
    branches: [main]
  pull_request:
    paths:
      - 'charts/**'   
  workflow_dispatch:
    inputs:
      node_image:
        description: 'kindest/node image for k8s kind cluster'
        # k8s version from 3.1 release
        default: 'kindest/node:v1.24.6'
        required: false
        type: string
      upgrade_from:
        description: 'Data exchange test service chart version to upgrade from'
        # DETS version from 3.1 release
        default: '1.0.10'
        required: false
        type: string

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Kubernetes KinD Cluster
        uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e # v2.0.4
        with:
          version: v0.19.0
          node_image: ${{ github.event.inputs.node_image || 'kindest/node:v1.24.6' }}
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: kind-registry:5000/data-exchange-test-service:testing

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.10.3

      # Setup python as a prerequisite for chart linting 
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@e6669bcd63d7cb57cb4380c33043eebe5d111992 # v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "CHART_CHANGED=true" >> $GITHUB_ENV
          fi
      # run chart linting 
      - name: Run chart-testing (lint)
        run: ct lint --charts charts/data-exchange --config charts/chart-testing-config.yaml

      # install the chart to the kind cluster and run helm test
      # define charts to test with the --charts parameter
      - name: Run chart-testing (install)
        run: ct install --charts charts/data-exchange --config charts/chart-testing-config.yaml --helm-extra-set-args "--set=image.tag=testing --set=image.repository=kind-registry:5000/data-exchange-test-service"
        if: github.event_name != 'pull_request' || steps.list-changed.outputs.changed == 'true'
        # Upgrade the released chart version with the locally available chart
        # default value for event_name != workflow_dispatch
      - name: Run helm upgrade
        run: |
          helm repo add tractusx-dev https://eclipse-tractusx.github.io/charts/dev
          helm install dataex tractusx-dev/data-exchange --version ${{ github.event.inputs.upgrade_from || '1.0.10' }}
          helm upgrade dataex charts/data-exchange
        if: github.event_name != 'pull_request' || steps.list-changed.outputs.changed == 'true'
